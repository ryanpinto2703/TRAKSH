<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TRAKSH – Local Monitoring Dashboard</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Serif+Devanagari:wght@500;700&display=swap"></noscript>
<style>
:root{--bg:#0a0d0b;--p:#121713;--p2:#181f19;--b:#2a3429;--t:#e8ece6;--m:#8d9a8b;--g:#c9a24b;--ok:#4caf6a;--wa:#e0a030;--cr:#e04b4b;--bl:#4b8fe0;--gy:#6b726a;--or:#e07a30;--ye:#b9c44a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px Inter,system-ui,sans-serif}
.dv{font-family:'Noto Serif Devanagari',serif}.gold{color:var(--g)}.mut{color:var(--m)}
#app{display:flex;min-height:100vh}
#sb{width:210px;background:var(--p);border-right:1px solid var(--b);padding:10px 8px;flex-shrink:0}
#sb.c{width:52px}#sb.c .lb{display:none}
.nv{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;cursor:pointer;color:var(--m);white-space:nowrap}
.nv:hover{background:var(--p2);color:var(--t)}.nv.a{background:#1d2a1f;color:var(--g);border-left:2px solid var(--g)}
#mn{flex:1;min-width:0}
#tb{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;background:var(--p);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
#pg{padding:14px}
.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:12px}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;color:var(--g);text-transform:uppercase}
.grid{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:900px){.two{grid-template-columns:1fr}#sb{width:52px}#sb .lb{display:none}}
.kv{font-size:20px;font-weight:700;margin:4px 0}.bar{height:5px;background:#243024;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bd{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.04em;border:1px solid currentColor}
.btn{background:#1d2a1f;color:var(--t);border:1px solid var(--b);padding:6px 10px;border-radius:5px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--g)}.btn.g{border-color:var(--g);color:var(--g)}.btn.r{border-color:var(--cr);color:var(--cr)}
input,select,textarea{background:#0d120e;color:var(--t);border:1px solid var(--b);border-radius:5px;padding:6px 8px;font:inherit}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--b);vertical-align:top}
th{color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
tr.cl:hover{background:var(--p2);cursor:pointer}.sc{overflow-x:auto}
.cam{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(0deg,#0c110d 0 3px,#101610 3px 6px);border-radius:6px;overflow:hidden;border:1px solid var(--b)}
.cam .o{position:absolute;font-size:11px;font-family:ui-monospace,monospace}
.rec{color:var(--cr)}.rec:before{content:"● ";animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.mp{position:relative;border:1px solid var(--b);border-radius:6px;overflow:hidden;background:#0d130e}
.mp svg{width:100%;display:block;touch-action:none;cursor:grab}
.pop{position:absolute;left:8px;top:8px;background:#0b100cf0;border:1px solid var(--g);border-radius:6px;padding:8px;font-size:11px;display:none;z-index:2}
.tl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
#toast{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;z-index:30}
.ts{background:#1b241c;border:1px solid var(--g);padding:8px 12px;border-radius:6px;max-width:300px}
#md{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#md>div{background:var(--p);border:1px solid var(--g);border-radius:8px;padding:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.ctr{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:20px;background:radial-gradient(circle at 50% 30%,#16201a,#070908 70%)}
.eye{animation:sc 2.4s ease-in-out infinite}@keyframes sc{50%{transform:scaleY(.25)}}
.fade{animation:fd 1s both}@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.ft{font-size:10px;letter-spacing:.2em;color:var(--m);margin-top:18px}
.sim{color:var(--bl);font-size:10px;letter-spacing:.08em}
</style></head><body><div id="root"></div><div id="toast"></div><div id="md"><div id="mdc"></div></div>

overview(){return`<div class="grid k">${kpi('⏻','Rover status','st','Simulated')}${kpi('⌖','Campus location','loc','Nearest zone')}${kpi('🔋','Battery','bat','Not configured')}${kpi('➤','Speed','spd','Time-lapse demo')}${kpi('↔','Distance','dst','HC-SR04 obstacle distance (live)')}${kpi('▦','Patrol coverage','cv','')}${kpi('▣','Camera','cm','ESP32-CAM via laptop YOLO')}${kpi('⚠','Active alerts','al','')}${kpi('✚','Sensor health','sh','')}</div><div class="grid two" style="margin-top:12px"><div class="grid"><div class="card"><h3>Camera surveillance · TRAKSH</h3>${cam()}</div><div class="card"><h3>Thapar campus map · TRAKSH-01 tracking</h3>${mapC()}<div style="margin-top:6px">${layerCtl()}</div></div></div><div class="grid" style="align-content:start">${tile('Operating mode',modeBtns()+'<div data-k="mi" class="mut" style="margin-top:6px"></div>')}${tile('Active alerts','<div id="al">'+alertRows(S.alerts.filter(a=>a.rs=='Pending').slice(0,3))+'</div><button class="btn" onclick="addAlert()">Trigger demo detection</button>')}${tile('Signal control status',sigCard())}${tile('Hardware status',S.sensors.slice(0,6).map(s=>`<div style="display:flex;justify-content:space-between;gap:6px"><span>${s.n.split(' (')[0]}</span>${badge(s.st)}</div>`).join(''))}</div></div><div class="grid two" style="margin-top:12px">${tile('Recent events',S.ev.slice(0,6).map(e=>`<div>${e[0]} – ${e[1]}</div>`).join('')||'<span class="mut">None yet</span>')}${tile('Patrol coverage','<div class="kv" data-k="cv"></div><div class="bar"><i data-b="cv"></i></div><div class="mut" style="margin-top:4px" data-k="area"></div>')}</div>`},
live(){return`<div class="card"><h3>Live surveillance · TRAKSH-01</h3>${cam()}<p class="mut">Live YOLO feed comes from the local Flask server. Detections are review prompts and do not control the rover.</p></div><div class="grid two" style="margin-top:12px"><div class="card">${rvDistCard()}</div><div class="card">${rvDriveCard()}</div></div>`},
map(){return`<div class="grid two"><div class="card"><h3>Campus map & rover tracking</h3>${mapC()}<div style="margin-top:6px">${layerCtl()}</div></div><div class="card"><h3>GPS information <span class="sim">SIMULATED</span></h3><div data-k="gps" style="line-height:1.9"></div></div></div>`},
alerts(){return`<div class="card"><h3>AI detection & review</h3><button class="btn g" onclick="addAlert()">Trigger demo detection</button><div style="margin-top:10px">${alertRows(S.alerts)}</div></div>`},
sensors(){const c=sensorSummary(),n=S.sensors.length,ok=c.GOOD||0;return`<div class="grid k">${[['Total',n,'--t'],['Operational',ok,'--ok'],['Fair',c.FAIR||0,'--ye'],['Needs repair',c.REPAIR||0,'--or'],['Service required',c.SERVICE||0,'--wa'],['Fully defective',c.DEFECTIVE||0,'--cr']].map(x=>`<div class="card"><div class="mut">${x[0]}</div><div class="kv" style="color:var(${x[2]})">${x[1]}</div><div class="bar"><i style="width:${x[1]/n*100}%;background:var(${x[2]})"></i></div></div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Sensor health monitoring</h3><div id="st">${sensTable()}</div></div><div class="card" style="margin-top:12px"><h3>Maintenance history</h3>${S.maint.map(m=>`<div>${m.t} – ${m.n}: ${badge(m.st)} ${m.r}</div>`).join('')||'<span class="mut">No maintenance events yet</span>'}</div>`},
comm(){return`<div class="grid two"><div class="card"><h3>TEA5767 FM receiver <span class="sim">SIMULATED READINGS</span></h3><div class="kv">${S.fm.f.toFixed(1)} MHz</div><div class="bar"><i style="width:${S.fm.sig}%"></i></div><p>Signal reception: ${S.fm.sig>50?'Receiving':'Weak'} (${S.fm.sig}%) · Health: ${badge(S.sensors[3].st)}</p><button class="btn" onclick="fmTune(-.1)">− 0.1</button> <button class="btn" onclick="fmTune(.1)">+ 0.1</button><p class="mut">Public FM broadcast receiver only. Not a radio interceptor and cannot decode private or encrypted communications. Broadcast reception is not a verified security event.</p></div>${tile('Reception history',S.fmh.map(h=>`<div>${h}</div>`).join('')||'<span class="mut">Tune to record</span>')}</div>`},
diag(){const sc={GOOD:95,FAIR:70,SERVICE:50,REPAIR:30,DEFECTIVE:5,SIM:60};return`<div class="grid k">${S.sensors.map(s=>`<div class="card"><b>${s.n.split(' (')[0]}</b><div style="margin:6px 0">${badge(s.st)}</div>${s.st=='NOTCONF'?'<div class="mut">No measurements – not installed</div>':`<div class="bar"><i style="width:${sc[s.st]}%;background:var(${ST[s.st][1]})"></i></div><div class="mut" style="font-size:11px">Condition score ${sc[s.st]}% (manual)</div>`}<button class="btn" style="margin-top:6px" onclick="detail(${S.sensors.indexOf(s)})">Inspect</button></div>`).join('')}</div><p class="sim">Voltage and temperature are not measured: no sensors for them are verified. Nothing is invented.</p>`},
missions(){return`<div class="card"><h3>Mission history <span class="sim">TEMPORARY – SESSION MEMORY ONLY</span></h3><input placeholder="Search mission" oninput="S.mq=this.value;$('#mt').innerHTML=missTable()"> From <input type="date" onchange="S.md=this.value;$('#mt').innerHTML=missTable()"> <button class="btn g" onclick="csv()">Export report (CSV)</button><div id="mt" style="margin-top:8px">${missTable()}</div></div>`},
officer(){const u=S.user;return`<div class="card" style="max-width:460px"><h3>Officer profile</h3><div style="font-size:30px;width:64px;height:64px;border-radius:50%;background:#1d2a1f;border:1px solid var(--g);display:flex;align-items:center;justify-content:center">AR</div><p><b>${u.name}</b> (fictional)<br>Officer ID ${u.id}<br>Auth method: DEMO LOGIN (not biometric)<br>Login: ${u.at.toLocaleString()}<br>Session: <span style="color:var(--ok)">Active</span></p><button class="btn r" onclick="logout()">Logout</button></div>`},
signal(){const g=S.sig,o=g.on;return`<div class="grid two"><div class="card" style="border-color:var(${o?'--cr':'--b'})"><h3>Bluetooth signal control</h3><div class="sim" style="font-size:12px;margin-bottom:8px">DEMO SIMULATION – NO ACTUAL SIGNAL INTERFERENCE</div><div class="kv" style="color:var(${o?'--cr':'--gy'})">● ${o?'SIGNAL CONTROL ACTIVATED':'SIGNAL CONTROL DEACTIVATED'}</div><button class="btn ${o?'r':'g'}" style="font-size:16px;padding:12px 18px;margin:8px 0" onclick="askSig()">SIGNAL CONTROL: ${o?'ON':'OFF'}</button><p>System readiness: Ready (software simulation)<br>Last change: ${g.last}<br>Operator: ${g.by}<br>Control mode: ${S.mode=='auto'?'Autonomous':'Manual operator'} (simulated)</p><p class="mut">Software-only control. It does not transmit, block or disrupt any signal and is not connected to any hardware.</p></div>${tile('Activity history',`<div class="sc"><table><tr><th>Event ID</th><th>Description</th><th>Status</th><th>Timestamp</th><th>Officer</th><th>Mode</th></tr>${g.log.map(e=>`<tr><td>${e.id}</td><td>${e.d}</td><td>${e.st}</td><td>${e.t}</td><td>${e.o}</td><td class="sim">SIMULATED</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No events yet</td></tr>'}</table></div>`)}</div>`},
settings(){return`<div class="card" style="max-width:560px"><h3>Settings</h3><p>Camera stream endpoint<br><input id="cu" style="width:100%" placeholder="http://ESP32-CAM-IP:81/stream" value="${S.cam}"></p><button class="btn g" onclick="S.cam=$('#cu').value;toast('Endpoint saved (session)')">Save</button> <button class="btn" onclick="resetDemo()">Reset demo</button><p class="mut">Touch ID / WebAuthn needs an Express backend for server-side challenges; it is not part of this single-page build.</p></div>`}};

function U(){const p=pos(S.trav),g=ll(p),cv=cov(),sc=sensorSummary(),ok=(sc.GOOD||0),n=S.sensors.length;const nearest=LM.map(z=>[Math.hypot(z[1]-p.x,z[2]-p.y),z[0]]).sort((a,b)=>a[0]-b[0])[0][1];
const st=S.halt?'HALTED (sw)':S.mode=='auto'?'PATROLLING':'MANUAL HOLD';
const V={st,loc:nearest,bat:'N/A',spd:(S.halt||S.mode!='auto'?0:1.4)+' m/s',dst:(S.live&&S.live.distance_cm!=null)?S.live.distance_cm.toFixed(0)+' cm':(S.live&&S.live.sensor==='offline'?'sensor offline':'no reading'),cv:cv+'%',cm:(S.live&&S.live.camera==='online')?'LIVE':'OFFLINE',al:S.alerts.filter(a=>a.rs=='Pending').length,sh:ok+'/'+n+' OK',ts:new Date().toLocaleString(),ms:S.mode=='auto'?'AUTONOMOUS MODE ACTIVE':'MANUAL OPERATOR MODE ACTIVE',mode:S.mode=='auto'?'AUTONOMOUS MODE ACTIVE':'MANUAL OPERATOR MODE ACTIVE',mi:S.mode=='auto'?'GPS tracking: simulated · Camera: demo · Route: on plan · Rover link: simulated':`Operator ${S.user.name} · takeover ${S.mt||''} · control link: simulated (no command sent)`,area:`Patrol route ${Math.round(L*M)} m · covered ${Math.round(L*M*cv/100)} m (${cv}%) · remaining ${Math.round(L*M*(100-cv)/100)} m`,gps:`Latitude: ${g[0]}<br>Longitude: ${g[1]}<br>Location: ${nearest}<br>GPS fix: SIMULATED 3D<br>Signal quality: n/a (GPS not configured)<br>Satellites: n/a<br>Speed: ${S.halt?0:1.4} m/s<br>Distance: ${Math.round(S.trav*M)} m<br>Mission duration: ${Math.round((Date.now()-S.t0)/1000)} s<br>Last update: ${new Date().toLocaleTimeString()}`};
$$('[data-k]').forEach(e=>{const k=e.dataset.k;if(V[k]!==undefined)e.innerHTML=V[k]});const pc={cv,al:Math.min(100,V.al*25),sh:ok/n*100,st:S.halt?0:100,cm:100,spd:50,dst:(S.live&&S.live.distance_cm!=null)?Math.min(100,S.live.distance_cm/200*100):0,loc:100,bat:0};$$('[data-b]').forEach(e=>e.style.width=(pc[e.dataset.b]||0)+'%');
$$('.msv').forEach(s=>{s.querySelector('.trail').setAttribute('points',upto(S.trav));s.querySelector('.cov').setAttribute('points',upto(S.trav));s.querySelector('.rv').setAttribute('transform',`translate(${p.x},${p.y}) rotate(${p.r})`);s.querySelector('.fov').setAttribute('transform',`translate(${p.x},${p.y}) rotate(${p.r}) scale(2)`)});
const pp=$('#pop');if(pp){pp.style.display=S.pop?'block':'none';pp.innerHTML=S.sel!=null?`<b class="gold">${LM[S.sel][0]}</b><br><span class="mut">Campus landmark (from uploaded map)</span>`:`<b class="gold">TRAKSH-01</b><br>${g[0]}, ${g[1]}<br>${nearest}<br>${V.ms}<br><span class="sim">SIMULATED</span>`}
const c=$('#clk');if(c)c.textContent=new Date().toLocaleString()}
setInterval(()=>{if(S.stage!='app')return;S.tick++;if(!S.halt&&S.mode=='auto'&&S.trav<L)S.trav+=40;if(false){S.auto=1;addAlert();return}U()},1000);
login();
