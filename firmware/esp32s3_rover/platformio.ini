; ESP32-S3: HC-SR04 distance, rover drive with watchdog and obstacle guard
; Change board if your S3 is not a DevKitC-1 (e.g. esp32-s3-devkitm-1).
[env:esp32s3_rover]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
